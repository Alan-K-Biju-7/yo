name: rset_student_app
description: A responsive Flutter recreation of the RSET student application.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/rset_official_logo.png
    - assets/images/rset_official_logo_vertical.png
