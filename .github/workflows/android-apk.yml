name: Android APK

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Prepare distributable files
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/RSET-Student-App-v1.0.0-universal-release.apk
          cd dist
          sha256sum RSET-Student-App-v1.0.0-universal-release.apk \
            > RSET-Student-App-v1.0.0-universal-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RSET-Student-App-v1.0.0-universal-release
          path: dist/*
          if-no-files-found: error
          retention-days: 90
